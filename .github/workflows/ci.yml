name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm --prefix db install --no-audit --no-fund
          npm --prefix backend install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund
      - name: Run all test suites
        run: npm test

  # The same suites, but against a real PostgreSQL server. The `test` job runs on
  # PGlite (Postgres in WASM), which parses BIGINT as a number; a real server
  # returns a string. That difference hid a money bug, so this job runs the
  # suites on the engine production actually uses.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      GOONJ_FRESH_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix db install --no-audit --no-fund
          npm --prefix backend install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund
      - name: Run all test suites against PostgreSQL
        run: npm test
